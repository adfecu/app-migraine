appId: com.twooceansinhealth.appmigraine
---
# Opens the screens the other checks do not cover and fails on a crash or a
# missing screen.
- runFlow: relaunch.yaml
- tapOn: ".*Diario.*"
- assertVisible: "Resumen de Episodios"
- tapOn: ".*Biblioteca.*"
- tapOn: ".*Inicio.*"
- tapOn: "Informe médico"
- extendedWaitUntil:
    visible: "Resumen del Período|Sin datos|No se pudo generar el informe"
    timeout: 20000
- takeScreenshot: smoke-report
- runFlow: relaunch.yaml
# On the simulator speech recognition is unavailable, so voice mode must open
# the manual crisis form.
- tapOn: "Me duele la cabeza"
- runFlow:
    when:
      visible: "Allow|OK|Permitir"
    commands:
      - tapOn: "Allow|OK|Permitir"
- runFlow:
    when:
      visible: "Allow|OK|Permitir"
    commands:
      - tapOn: "Allow|OK|Permitir"
- extendedWaitUntil:
    visible: "¿Cuándo comenzó el dolor?"
    timeout: 30000
