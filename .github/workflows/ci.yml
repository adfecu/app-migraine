name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci

  database:
    # Applies every migration to a fresh Postgres to prove the schema is reproducible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - name: Check generated types are up to date
        run: |
          # PostgrestVersion differs between the local stack and production, so it is ignored.
          npx supabase gen types typescript --local --schema public > /tmp/database.ts
          diff <(grep -v PostgrestVersion types/database.ts) <(grep -v PostgrestVersion /tmp/database.ts)
